[package]
name = "tinysearch"
version = "0.10.0"
authors = ["Matthias Endler <matthias-endler@gmx.net>"]
edition = "2024"
rust-version = "1.85"
resolver = "2"
description = "A tiny search engine for static websites"
readme = "README.md"
keywords = ["search", "static-site", "wasm", "full-text-search"]
categories = ["command-line-utilities", "web-programming", "wasm"]
license = "Apache-2.0 OR MIT"
homepage = "https://github.com/mre/tinysearch"
repository = "https://github.com/mre/tinysearch"
documentation = "https://docs.rs/tinysearch"
include = ["/src/**", "/assets/**", "/README.md", "/LICENSE-*"]

[lib]

[[bin]]
name = "tinysearch"
required-features = ["bin"]

[dependencies]
bincode = { version = "2.0.1", features = ["serde"] }

argh = { version = "0.1.19", optional = true }
log = { version = "0.4.33", optional = true }
serde_json = "1.0.151"
anyhow = { version = "1.0.104", optional = true }
tempfile = { version = "3.27.0", optional = true }

strip_markdown = "0.2.0"
strum = { version = "0.28.0", features = ["derive"], optional = true }
toml = { version = "1.1.4", optional = true }
toml_edit = { version = "0.25.13", optional = true }


[dependencies.serde]
version = "1.0.229"
features = ["derive"]

[dependencies.xorf]
version = "0.12.0"
default-features = false
features = ["serde"]


[features]
default = []
bin = ["argh", "log", "anyhow", "tempfile", "strum", "toml", "toml_edit"]

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
warnings = { level = "deny", priority = -1 }
missing_docs = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "forbid"

[lints.clippy]
# Keep all generally applicable Clippy groups at error level. Specific
# restriction lints are selected below because the full restriction group
# intentionally contains conflicting and situational rules.
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

# Restriction lints for production code.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"

# Performance lints.
inefficient_to_string = "deny"
large_enum_variant = "deny"
trivially_copy_pass_by_ref = "deny"

# Correctness lints.
arithmetic_side_effects = "deny"
float_arithmetic = "deny"
as_conversions = "deny"

# Style lints.
string_add = "deny"
string_add_assign = "deny"
single_char_lifetime_names = "deny"
explicit_deref_methods = "deny"
