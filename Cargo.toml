[package]
name = "tinysearch"
version = "0.10.0"
authors = ["Matthias Endler <matthias-endler@gmx.net>"]
edition = "2024"
rust-version = "1.85"
resolver = "2"
description = "A tiny search engine for static websites"
readme = "README.md"
license = "Apache-2.0 OR MIT"
homepage = "https://github.com/mre/tinysearch"
repository = "https://github.com/mre/tinysearch"
documentation = "https://docs.rs/tinysearch"
include = ["/src/**", "/assets/**", "/README.md", "/LICENSE-*"]

[lib]

[[bin]]
name = "tinysearch"
required-features = ["bin"]

[dependencies]
bincode = { version = "2.0.1", features = ["serde"] }

argh = { version = "0.1.19", optional = true }
log = { version = "0.4.33", optional = true }
serde_json = "1.0.151"
anyhow = { version = "1.0.104", optional = true }
tempfile = { version = "3.27.0", optional = true }

strip_markdown = "0.2.0"
strum = { version = "0.28.0", features = ["derive"], optional = true }
toml = { version = "1.1.4", optional = true }
toml_edit = { version = "0.25.13", optional = true }


[dependencies.serde]
version = "1.0.229"
features = ["derive"]

[dependencies.xorf]
version = "0.12.0"
default-features = false
features = ["serde"]


[features]
default = []
bin = ["argh", "log", "anyhow", "tempfile", "strum", "toml", "toml_edit"]

[dev-dependencies]
tempfile = "3.27.0"

[lints.clippy]
# Pedantic lints that help with code quality (lower priority so allows can override)
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Restriction lints for better code practices  
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unreachable = "warn"

# Performance lints
inefficient_to_string = "warn"
large_enum_variant = "warn"
trivially_copy_pass_by_ref = "warn"

# Correctness lints
arithmetic_side_effects = "warn"
float_arithmetic = "warn"
as_conversions = "warn"

# Style lints
string_add = "warn"
string_add_assign = "warn"
single_char_lifetime_names = "warn"
explicit_deref_methods = "warn"

# Allow some pedantic lints that are too noisy
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
