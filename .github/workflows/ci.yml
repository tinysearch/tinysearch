name: CI

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - "v*"
  schedule:
    # Run weekly to catch ecosystem and toolchain regressions.
    - cron: "20 23 * * 4"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ runner.os }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run cargo check
        run: cargo check --locked --all-targets --all-features

      - name: Run clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-features

  build:
    name: Build (${{ matrix.os }}, Rust ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, beta]
        include:
          - os: ubuntu-latest
            rust: "1.85.0"
          - os: ubuntu-latest
            rust: nightly

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Install WASM target
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        run: rustup target add wasm32-unknown-unknown

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ matrix.os }}-${{ matrix.rust }}

      - name: Build and install tinysearch
        run: cargo install --locked --force --path . --features=bin
        continue-on-error: ${{ matrix.rust == 'nightly' }}

      - name: Build WASM package from test index
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        run: tinysearch -m wasm -p wasm_output --engine-version "path=\"$GITHUB_WORKSPACE\"" fixtures/index.json

      - name: Generate docs
        if: matrix.rust == 'stable'
        run: cargo doc --locked --all-features --no-deps

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Audit dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
