[workspace]
members = ["."]
resolver = "2"

[package]
name = "word-index-bench"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
anyhow = "1.0.104"
bincode = { version = "2.0.1", features = ["serde"] }
fcsd = "0.2.0"
fst = "0.4.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
strip_markdown = "0.2.0"
xorf = { version = "0.12.0", default-features = false, features = ["serde"] }
